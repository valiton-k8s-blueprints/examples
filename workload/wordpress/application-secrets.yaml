---
apiVersion: v1
kind: Namespace
metadata:
  name: wordpress
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: mariadb-password-generator
  namespace: wordpress
spec:
  length: 32
  digits: 10
  symbols: 0
  symbolCharacters: ""
  noUpper: false
  allowRepeat: true
  secretKeys:
    - mariadb-root-password
    - mariadb-replication-password
    - mariadb-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mariadb
  namespace: wordpress
spec:
  refreshInterval: "0s"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: mariadb-password-generator
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: wordpress-password-generator
  namespace: wordpress
spec:
  length: 18
  digits: 6
  symbols: 6
  symbolCharacters: "$-_.+!*'(),"
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wordpress
  namespace: wordpress
spec:
  refreshInterval: "0s"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: wordpress-password-generator
      rewrite:
        - regexp:
           source: password
           target: wordpress-password
